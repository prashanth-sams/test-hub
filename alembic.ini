# Alembic configuration for the repository.
#
# This file exists so that `alembic revision --autogenerate` works from a
# checkout. It is NOT how the application migrates itself: `test-hub serve`
# calls test_hub.storage.db.Database.upgrade(), which builds its own Config
# pointing at the same scripts and takes the URL from Settings. The wheel does
# not ship this file.
#
# The URL below is a placeholder. env.py prefers, in order:
#   1. the Settings object passed in through config.attributes
#   2. `alembic -x url=...`
#   3. this file
#   4. Settings loaded from the environment
[alembic]
script_location = src/test_hub/storage/migrations
prepend_sys_path = src
path_separator = os
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
