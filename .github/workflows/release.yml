# Publish to PyPI, on a tag, with no secret anywhere in this file.
#
# Trusted Publishing (OIDC)
# -------------------------
# GitHub mints a short-lived, audience-scoped OIDC token for this workflow run.
# PyPI verifies it against a publisher you register once — repository, workflow
# filename and environment name must all match — and exchanges it for an upload
# token that lives for about fifteen minutes. There is no long-lived API token to
# store, to leak, or to remember to rotate, and a token stolen from a build log
# is worthless four commits later.
#
# It has to be set up on PyPI *before* the first tag, or this job fails with a
# 403 that reads like a permissions bug. See CONTRIBUTING.md § Releasing.
#
# The `environment: pypi` line is not decoration. It is part of the identity PyPI
# checks, and it is where you configure a required reviewer so that publishing a
# release is a decision someone makes rather than a side effect of pushing a tag.

name: Release

on:
  push:
    tags: ["v*"]
  # Lets you rehearse the build — and only the build — without creating a tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # never interrupt a half-finished upload

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # setuptools-scm is not in use, but a shallow clone also hides the tag
          # from anything that wants to describe it. Cheap insurance.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: twine check --strict dist/*

      # The tag is the release. If it disagrees with version.py the wheel on
      # PyPI would be named something other than what the tag claims, and PyPI
      # never lets you re-upload a filename — so this has to fail before the
      # publish job, not after.
      - name: Tag must match test_hub.version.__version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          code="$(python -c 'import pathlib,re,sys; t=pathlib.Path("src/test_hub/version.py").read_text(); m=re.search(r"__version__\s*=\s*\"([^\"]+)\"", t); sys.stdout.write(m.group(1) if m else "")')"
          echo "tag=$tag  version.py=$code"
          if [ "$tag" != "$code" ]; then
            echo "::error::tag v$tag does not match __version__ $code in src/test_hub/version.py"
            exit 1
          fi
          # A wheel whose filename does not carry the tagged version means the
          # build backend read the version from somewhere else.
          ls dist/ | grep -q -- "-$code-" || {
            echo "::error::no distribution in dist/ is named for version $code"; ls -l dist/; exit 1; }

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    # Tags only. `workflow_dispatch` builds, so you can rehearse; it does not
    # publish, so you cannot rehearse your way into an immutable upload.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Both halves of the Trusted Publisher identity. The environment name is
    # matched by PyPI, and gives you the approval gate and the deployment log.
    environment:
      name: pypi
      url: https://pypi.org/p/test-hub

    # `id-token: write` is what lets this job ask GitHub for an OIDC token. It
    # is granted here and not at the top of the file so that the build job —
    # which runs arbitrary project code through the build backend — cannot mint
    # an identity that speaks for this repository.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Pinned to the branch PyPA documents for this action rather than to a
      # tag: it is the ref they move for security fixes to the OIDC exchange,
      # and it is the one the PyPI docs tell publishers to trust.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `with: password:`. No `secrets.PYPI_API_TOKEN`. If you find
        # yourself adding one, the Trusted Publisher is misconfigured — fix it
        # there instead. Everything this step needs, it gets from the OIDC token
        # and from `dist/`.
        with:
          print-hash: true

  # ---------------------------------------------------------------------------
  # TestPyPI rehearsal — uncomment to try a release end to end without spending
  # a version number on the real index.
  #
  # It needs its own Trusted Publisher registered at https://test.pypi.org, with
  # environment name `testpypi`, and its own GitHub environment of that name.
  # TestPyPI is also periodically pruned and does not resolve dependencies the
  # same way, so treat a successful upload as proof the *pipeline* works, not
  # that the package installs.
  #
  # Drive it from a pre-release tag (v0.2.0rc1) so a rehearsal never collides
  # with a real one:
  #
  # publish-testpypi:
  #   name: Publish to TestPyPI
  #   needs: build
  #   if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, 'rc')
  #   runs-on: ubuntu-latest
  #   environment:
  #     name: testpypi
  #     url: https://test.pypi.org/p/test-hub
  #   permissions:
  #     id-token: write
  #     contents: read
  #   steps:
  #     - uses: actions/download-artifact@v4
  #       with:
  #         name: dist
  #         path: dist
  #     - uses: pypa/gh-action-pypi-publish@release/v1
  #       with:
  #         repository-url: https://test.pypi.org/legacy/
  #         print-hash: true
  #         # TestPyPI accumulates rehearsals; skipping an existing filename
  #         # keeps a re-run of the workflow from failing on a duplicate.
  #         skip-existing: true
  # ---------------------------------------------------------------------------
