# Continuous integration.
#
# Two things are being checked here and they are not the same thing:
#
#   `test`         — the code is correct on every Python and OS we claim.
#   `wheel-smoke`  — what `pip install test-hub` actually gives a stranger works.
#
# The second is the one that catches the failures that embarrass a release: a
# data file left out of the wheel, an entry point that does not resolve, an
# exporter that emits an HTML file referencing assets that only exist in the
# source checkout. Running the CLI from a clean virtualenv with no repository on
# disk is the only way to see those.

name: CI

on:
  push:
    # Naming `branches` already means a tag push does not match this event, so a
    # release tag runs release.yml and only release.yml.
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. No job here needs to write to the repository, and a
# workflow that cannot push cannot be turned into one by a compromised
# dependency.
permissions:
  contents: read

# One run per ref. Pushing three times to a pull request should cost one CI run,
# not three; the superseded ones are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    # Git Bash is present on the Windows runners, so one set of shell commands
    # covers all three platforms and `dist/*` globs the same way everywhere.
    defaults:
      run:
        shell: bash

    strategy:
      # One platform failing should not hide the result on the other four.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12", primary: true }
          - { os: ubuntu-latest, python: "3.13" }
          # macOS and Windows run one version each. The things that break on
          # them are path separators, line endings and the platform data
          # directory — none of which vary by Python version, so a full matrix
          # would buy repetition rather than coverage.
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check --output-format=github .

      - name: Format (ruff format --check)
        run: ruff format --check --diff .

      - name: Types (mypy --strict)
        run: mypy

      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      # Built on every platform on purpose: a wheel that only builds on Linux is
      # a wheel that fails for the first contributor on a Mac.
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check metadata renders on PyPI
        run: twine check --strict dist/*

      # Only the primary job's artifacts go forward. The wheel is pure Python,
      # so all five builds are equivalent and keeping one avoids a name clash in
      # the download step.
      - name: Upload distributions
        if: matrix.primary
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  wheel-smoke:
    name: Installed-wheel smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # A virtualenv with nothing in it, in a directory with no checkout: if the
      # CLI needs a file that lives in the repository rather than in the wheel,
      # it fails here and nowhere else.
      - name: Install the wheel into a clean virtualenv
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/smoke/bin/pip" install dist/*.whl
          # Nothing from this checkout may be importable from the run directory.
          mkdir -p "$RUNNER_TEMP/elsewhere"

      - name: test-hub --version
        working-directory: ${{ runner.temp }}/elsewhere
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/smoke/bin/test-hub" --version

      # Printed, not asserted on: it costs one line and turns "unrecognised
      # option --output" three steps below into an obvious diagnosis instead of
      # a guess.
      - name: Show the CLI surface
        working-directory: ${{ runner.temp }}/elsewhere
        run: |
          "$RUNNER_TEMP/smoke/bin/test-hub" --help
          "$RUNNER_TEMP/smoke/bin/test-hub" export --help

      - name: Seed demo data and export a snapshot
        working-directory: ${{ runner.temp }}/elsewhere
        env:
          TEST_HUB_DATA_DIR: ${{ runner.temp }}/smoke-data
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/smoke/bin/test-hub" demo
          "$RUNNER_TEMP/smoke/bin/test-hub" export --output report.html
          ls -l report.html

      # The real packaging test. A snapshot that pulls a stylesheet from the
      # source tree looks perfect in CI and is blank on the reviewer's laptop,
      # and one that pulls a font from a CDN quietly breaks the offline promise
      # and leaks a request to whoever opens the report.
      - name: Assert the export is one self-contained file
        working-directory: ${{ runner.temp }}/elsewhere
        run: |
          python - report.html <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          if not path.is_file():
              sys.exit(f"FAIL: {path} was not produced")

          html = path.read_text(encoding="utf-8", errors="replace")
          size = path.stat().st_size
          problems: list[str] = []

          # A dashboard with CSS, JS and embedded data cannot be small. A tiny
          # file here means the exporter wrote a stub and exited 0.
          if size < 20_000:
              problems.append(f"only {size} bytes — that is a stub, not a dashboard")
          if "<html" not in html.lower():
              problems.append("no <html> element")

          # Every URL the browser would *fetch*. A plain <a href> hyperlink is
          # not one of those — clicking "report an issue" needs the network, but
          # rendering the page does not — so anchors are exempt and everything
          # else is not. data:, fragments and about:blank are already inside the
          # file or inert.
          tag = re.compile(r"<(?P<name>[a-zA-Z][-\w:]*)(?P<attrs>[^>]*)>")
          url_attr = re.compile(
              r"""\b(?:src|srcset|href|xlink:href|data|poster)\s*=\s*"""
              r"""(?P<q>["'])(?P<url>[^"']*)(?P=q)""",
              re.IGNORECASE,
          )
          external: set[str] = set()
          for element in tag.finditer(html):
              if element.group("name").lower() == "a":
                  continue
              for attr in url_attr.finditer(element.group("attrs")):
                  url = attr.group("url").strip()
                  if not url or url.startswith(("data:", "#", "about:blank")):
                      continue
                  external.add(f"<{element.group('name')} …={url[:80]}>")
          if external:
              listed = ", ".join(sorted(external)[:10])
              problems.append(f"references {len(external)} file(s) it does not contain: {listed}")

          for pattern, why in (
              (r"@import\b", "CSS @import pulls in another stylesheet"),
              (r"url\(\s*['\"]?(?:https?:)?//", "CSS url() points at a remote origin"),
              (r"\bintegrity\s*=", "an SRI hash implies a remote asset"),
          ):
              if re.search(pattern, html, re.IGNORECASE):
                  problems.append(why)

          if problems:
              print(f"{path} ({size} bytes) is NOT self-contained:")
              for problem in problems:
                  print(f"  - {problem}")
              sys.exit(1)

          print(f"OK: {path} is one self-contained file, {size} bytes, no external references")
          PY

  # ----------------------------------------------------------------------------
  # Aggregate status. Branch protection points at this one job, so adding a
  # matrix entry never means editing the required-checks list.
  ci:
    name: CI
    if: always()
    needs: [test, wheel-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job did not succeed
        run: |
          set -euo pipefail
          echo "test:        ${{ needs.test.result }}"
          echo "wheel-smoke: ${{ needs.wheel-smoke.result }}"
          [ "${{ needs.test.result }}" = "success" ] || exit 1
          [ "${{ needs.wheel-smoke.result }}" = "success" ] || exit 1
