# Continuous integration.
#
# Two things are being checked here and they are not the same thing:
#
#   `test`         — the code is correct on every Python and OS we claim.
#   `wheel-smoke`  — what `pip install test-hub` actually gives a stranger works.
#
# The second is the one that catches the failures that embarrass a release: a
# data file left out of the wheel, an entry point that does not resolve, a
# dashboard that asks for an asset which only exists in the source checkout.
# Running the CLI from a clean virtualenv with no repository on disk is the only
# way to see those.

name: CI

# TEMPORARILY DISABLED: CI no longer runs automatically on pushes or pull
# requests. It can still be started by hand from the Actions tab ("Run
# workflow"). To turn it back on, uncomment the `push` and `pull_request`
# triggers below.
on:
  # push:
  #   # Naming `branches` already means a tag push does not match this event, so a
  #   # release tag runs release.yml and only release.yml.
  #   branches: [main]
  # pull_request:
  workflow_dispatch:

# Read-only by default. No job here needs to write to the repository, and a
# workflow that cannot push cannot be turned into one by a compromised
# dependency.
permissions:
  contents: read

# One run per ref. Pushing three times to a pull request should cost one CI run,
# not three; the superseded ones are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    # Git Bash is present on the Windows runners, so one set of shell commands
    # covers all three platforms and `dist/*` globs the same way everywhere.
    defaults:
      run:
        shell: bash

    strategy:
      # One platform failing should not hide the result on the other four.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12", primary: true }
          - { os: ubuntu-latest, python: "3.13" }
          # macOS and Windows run one version each. The things that break on
          # them are path separators, line endings and the platform data
          # directory — none of which vary by Python version, so a full matrix
          # would buy repetition rather than coverage.
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check --output-format=github .

      - name: Format (ruff format --check)
        run: ruff format --check --diff .

      - name: Types (mypy --strict)
        run: mypy

      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      # Built on every platform on purpose: a wheel that only builds on Linux is
      # a wheel that fails for the first contributor on a Mac.
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check metadata renders on PyPI
        run: twine check --strict dist/*

      # Only the primary job's artifacts go forward. The wheel is pure Python,
      # so all five builds are equivalent and keeping one avoids a name clash in
      # the download step.
      - name: Upload distributions
        if: matrix.primary
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  wheel-smoke:
    name: Installed-wheel smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # A virtualenv with nothing in it, in a directory with no checkout: if the
      # CLI needs a file that lives in the repository rather than in the wheel,
      # it fails here and nowhere else.
      - name: Install the wheel into a clean virtualenv
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/smoke/bin/pip" install dist/*.whl
          # Nothing from this checkout may be importable from the run directory.
          mkdir -p "$RUNNER_TEMP/elsewhere"

      - name: test-hub --version
        working-directory: ${{ runner.temp }}/elsewhere
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/smoke/bin/test-hub" --version

      # Printed, not asserted on: it costs one line and turns an unrecognised
      # option three steps below into an obvious diagnosis instead of a guess.
      - name: Show the CLI surface
        working-directory: ${{ runner.temp }}/elsewhere
        run: |
          "$RUNNER_TEMP/smoke/bin/test-hub" --help

      - name: Seed demo data and serve it
        working-directory: ${{ runner.temp }}/elsewhere
        env:
          TEST_HUB_DATA_DIR: ${{ runner.temp }}/smoke-data
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/smoke/bin/test-hub" demo
          nohup "$RUNNER_TEMP/smoke/bin/test-hub" serve --port 8901 > serve.log 2>&1 &
          echo $! > serve.pid
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8901/healthz > /dev/null 2>&1; then
              echo "server is up"; exit 0
            fi
            sleep 1
          done
          echo "server never became healthy:"; cat serve.log; exit 1

      # The real packaging test. A dashboard that pulls a stylesheet from the
      # source tree renders perfectly in a developer's checkout and is blank
      # from the wheel, and one that pulls a font from a CDN quietly breaks the
      # promise that an air-gapped install works. Both are invisible until
      # something asks the *installed* package for every file the page names.
      - name: Assert the served dashboard is complete and self-hosted
        working-directory: ${{ runner.temp }}/elsewhere
        run: |
          curl -fsS http://127.0.0.1:8901/ -o page.html
          python - page.html <<'PY'
          import re
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path

          BASE = "http://127.0.0.1:8901/"
          html = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          problems: list[str] = []

          if "<html" not in html.lower():
              problems.append("no <html> element")

          # Every URL the browser would *fetch*. A plain <a href> hyperlink is
          # not one of those — clicking "report an issue" needs the network, but
          # rendering the page does not — so anchors are exempt and everything
          # else is not. data:, fragments and about:blank are inert.
          tag = re.compile(r"<(?P<name>[a-zA-Z][-\w:]*)(?P<attrs>[^>]*)>")
          url_attr = re.compile(
              r"""\b(?:src|srcset|href|xlink:href|data|poster)\s*=\s*"""
              r"""(?P<q>["'])(?P<url>[^"']*)(?P=q)""",
              re.IGNORECASE,
          )
          fetched = 0
          for element in tag.finditer(html):
              if element.group("name").lower() == "a":
                  continue
              for attr in url_attr.finditer(element.group("attrs")):
                  url = attr.group("url").strip()
                  if not url or url.startswith(("data:", "#", "about:blank")):
                      continue
                  if url.startswith(("http://", "https://", "//")):
                      problems.append(f"{url[:80]} is off-origin")
                      continue
                  try:
                      with urllib.request.urlopen(BASE + url.lstrip("/"), timeout=20) as resp:
                          body = resp.read()
                      fetched += 1
                      if not body:
                          problems.append(f"{url} served 0 bytes")
                  except urllib.error.HTTPError as err:
                      problems.append(f"{url} -> HTTP {err.code} (missing from the wheel?)")
                  except OSError as err:
                      problems.append(f"{url} -> {err}")

          if not fetched:
              problems.append("the page referenced no assets at all — it is a stub")

          # …and the data path, because a dashboard that loads and shows nothing
          # is not a working install either.
          try:
              with urllib.request.urlopen(BASE + "api/v1/overview", timeout=20) as resp:
                  payload = resp.read().decode()
              if '"total_runs"' not in payload:
                  problems.append("GET /api/v1/overview returned an unexpected shape")
          except OSError as err:
              problems.append(f"GET /api/v1/overview -> {err}")

          if problems:
              print("the installed dashboard is NOT complete:")
              for problem in problems:
                  print(f"  - {problem}")
              sys.exit(1)

          print(f"OK: {fetched} assets served from the wheel, none off-origin")
          PY

      - name: Stop the server
        if: always()
        working-directory: ${{ runner.temp }}/elsewhere
        run: |
          [ -f serve.pid ] && kill "$(cat serve.pid)" || true
          [ -f serve.log ] && cat serve.log || true

  # ----------------------------------------------------------------------------
  # Aggregate status. Branch protection points at this one job, so adding a
  # matrix entry never means editing the required-checks list.
  ci:
    name: CI
    if: always()
    needs: [test, wheel-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job did not succeed
        run: |
          set -euo pipefail
          echo "test:        ${{ needs.test.result }}"
          echo "wheel-smoke: ${{ needs.wheel-smoke.result }}"
          [ "${{ needs.test.result }}" = "success" ] || exit 1
          [ "${{ needs.wheel-smoke.result }}" = "success" ] || exit 1
