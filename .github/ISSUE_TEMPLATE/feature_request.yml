name: Feature request
description: Something Test Hub should do and does not.
title: "feat: "
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: |
        The most useful feature requests describe a situation, not a solution.
        "I need to see which tests got slower after Tuesday's merge" tells us
        more than "add a duration column", because it leaves room for the answer
        to be better than the column.

  - type: dropdown
    id: kind
    attributes:
      label: What kind of thing is this
      options:
        - A new report format (adapter)
        - Something about the dashboard
        - Something about the metrics
        - Something about the API or the SDK
        - Something about the CLI
        - Something about deployment or packaging
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The situation
      description: >
        What are you trying to find out or do, what happens today, and why is
        that not enough? Concrete beats general — one real run, one real
        question you could not answer.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: Optional. If you already know the shape of the answer, describe it.

  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: >
        The workaround, however ugly. It is usually the clearest statement of the
        requirement.

  - type: markdown
    attributes:
      value: |
        ### If this is a new report format

        Adapters are entry-point plugins — they do not have to live in this
        repository, and shipping one as its own package means it releases on
        your schedule rather than ours. `docs/adapters.md` is the guide, and
        `src/test_hub/adapters/junit_xml.py` is a complete worked example.

        We are still glad to hear about formats we should support in core. What
        makes that case is a **real report file** (anonymised) plus which tool
        and version produced it — attach one below and it becomes a fixture.

  - type: textarea
    id: sample
    attributes:
      label: Sample report file
      description: Only if this is about a format. Anonymised.
      render: xml

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and discussions.
          required: true
        - label: >
            I understand this is a small project and that a well-described
            request may sit open for a while, or be answered with "as a plugin".
          required: true
